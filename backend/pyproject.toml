[project]
name = "flowfic-backend"
version = "0.1.0"
description = "FastAPI backend for FLOWFIC — Auth0-backed auth, words and stories APIs."
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "en-core-web-md",
    "es-core-news-md",
    "fastapi>=0.138.1",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pydantic>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "sentence-transformers>=5.6.0",
    "simplemma>=1.2.0",
    "spacy>=3.8.13",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.49.0",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "respx>=0.23.1",
    "ruff>=0.15.20",
]

### Test

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
env = [
    # Mandatory settings the suite relies on. In-memory SQLite keeps tests
    # file-free; per-test DBs are wired via fixtures in conftest.
    "ENVIRONMENT=testing",
    "AUTH0_DOMAIN=",
    "AUTH0_AUDIENCE=",
    "DATABASE_URL=sqlite://",
    "FRONTEND_ORIGIN=http://localhost:3000",
    "DEV_USER_ENABLED=true",
    "DEV_USER_TOKEN=dev-test-token",
    "EMAIL_VALIDATION_CHECK_DELIVERABILITY=false",
    # Keep the wordfreq candidate pool tiny so vocabulary/random tests are fast;
    # the embedding model itself is stubbed out (see conftest).
    "WORD_EMBEDDINGS_VOCAB_SIZE=1000",
]
addopts = [
    "--cov",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["app"]
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = false
sort = "Cover"

### Lint

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".venv/"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "A",        # Detect shadowing of Python builtins
    "B",        # Catch likely bugs and bad design (flake8-bugbear)
    "D213",     # Multi-line docstring summary starts on the second line
    "E",        # pycodestyle errors
    "F",        # Pyflakes: unused/undefined names, import errors
    "I",        # Sort and group imports (isort)
    "N",        # PEP 8 naming conventions
    "S",        # Security checks (bandit)
    "T",        # Disallow `print`/`pdb`/`breakpoint` calls
    "W",        # pycodestyle warnings
    "C4",       # Encourage idiomatic comprehensions
    "BLE",      # Disallow blind `except:` clauses
    "FURB",     # Modernize legacy patterns (refurb)
    "INP",      # Disallow implicit namespace packages (require __init__.py)
    "ISC",      # Detect implicit string concatenation issues
    "PGH",      # Miscellaneous pygrep-hooks (noqa hygiene, etc.)
    "PIE",      # Miscellaneous lints (flake8-pie)
    "PLW",      # Pylint warnings
    "RSE",      # Style for `raise` statements
    "TCH",      # Move type-only imports into `TYPE_CHECKING` blocks
    "PT",       # pytest style conventions
]
ignore = [
    "E501",     # Line too long
    "E731",     # Lambda assignment instead of `def`
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime to build models, so imports
# used only as field types must stay at module scope. Marking BaseModel/SQLModel
# as runtime-evaluated stops TC001/TC002 from pushing those imports into a
# TYPE_CHECKING block (which would break model construction at import time).
runtime-evaluated-base-classes = ["pydantic.BaseModel", "sqlmodel.SQLModel"]

[tool.ruff.lint.per-file-ignores]
"app/scripts/*" = ["T"]
"tests/*" = ["D", "S", "INP001", "TC002", "TC003"]
# Route handlers take the centralized DI aliases (app.dependencies) and ORM
# types as parameter annotations, which FastAPI introspects at runtime — they
# must stay real imports, so TC001 (move into a TYPE_CHECKING block) is a false
# positive here. The DI module itself is clean because the aliases are built in
# runtime assignments, not annotations.
"app/routes/*" = ["TC001"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
exclude = [".venv/"]

[tool.uv.sources]
es-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_md-3.8.0/es_core_news_md-3.8.0-py3-none-any.whl" }
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
