[project]
name = "flowfic-stress"
version = "0.1.0"
description = "Load-test harness for the Flowfic production stack: cohort seeding, k6 orchestration, host monitoring."
requires-python = ">=3.14"
# Deliberately dependency-free. The harness shells out to ssh, docker and k6
# rather than talking to the server over a library, so it stays runnable on a
# fresh checkout with nothing but `uv sync`.
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

# Not an installable package — a dependency env plus a CLI run through
# `uv run python -m flowfic_stress`.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--cov=flowfic_stress", "--cov-report=term-missing"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "N", "C4", "UP", "BLE"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true
strict = true
